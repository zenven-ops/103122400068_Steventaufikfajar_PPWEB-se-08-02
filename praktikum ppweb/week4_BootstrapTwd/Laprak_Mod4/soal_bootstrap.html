<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pendaftaran Peserta Praktikum Pemrograman Web</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body>
    <h1 class="text-center fw-bold text-uppercase" >Pendaftaran Praktikum Pemrograman Web</h1>
    <div class="container-md text-center">
        <div class="row">
            <div class="col-12 col-md-6">
                Informasi Praktikum <br>
                <img src="assets/web.jpg" class="img-fluid" alt="">
                <p>Praktikum ini belajar cara membuat web dari 0</p>
            </div>
            <div class="col-12 col-md-6">
                Form
                <br>
                <form>
                <div class="mb-3">
                    <label for="exampleInputName" class="form-label ">Nama Lengkap</label>
                    <input type="text" class="form-control" id="exampleInputName" aria-describedby="name1" required>
                </div>
                    <div class="mb-3">
                    <label for="exampleInputNIM" class="form-label ">NIM</label>
                    <input type="text" class="form-control" id="exampleInputNIM" aria-describedby="nim1" required>
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
                    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                </div>
                    <div class="mb-3">
                    <label for="exampleInputKelas" class="form-label ">Kelas</label>
                    <input type="text" class="form-control" id="exampleInputKelas" aria-describedby="kelas1" required>
                </div>
                <button type="submit" class="btn btn-success">Daftar</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
                </form>
            </div>
            <br>
            <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <th scope="col">No.</th>
                        <th scope="col">Nama Lengkap</th>
                        <th scope="col">NIM</th>
                        <th scope="col">Kelas</th>
                    </tr>
                </thead>
                <tr>
                    <th scope="row">1</th>
                    <td>Alya Putri</td>
                    <td>101142400101</td>
                    <td>IF-45-01</td>
                </tr>
                    <tr>
                    <th scope="row">2</th>
                    <td>Bima Pratama</td>
                    <td>101142400102</td>
                    <td>IF-45-02</td>
                </tr>
                    <tr>
                    <th scope="row">3</th>
                    <td>Nabila Zahra</td>
                    <td>101142400103</td>
                    <td>IF-45-01</td>
                </tr>
            </table>
            </div>
        </div>
    </div>

</body>
</html>
